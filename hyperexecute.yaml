
version: "0.1"

runson: ${matrix.os}

matrix:
  os: ["win", "linux"]

concurrency: 2
combineTasksInMatrixMode: true

globalTimeout: 60
testSuiteTimeout: 60
testSuiteStep: 60

env:
  TEST_ENV: "hyperexecute"
  BASE_URL: "https://www.testmuai.com"
  DEMO_API_TOKEN: ${{.secrets.DEMO_API_TOKEN}}

pre:
  - npm install
  - npx playwright install chrome

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

testSuites:
  - npm test

retryOnFailure: false

mergeArtifacts: true

uploadArtefacts:
  - name: Playwright-HTML-Report
    path:
      - playwright-report/**
  - name: Playwright-Test-Results
    path:
      - test-results/**
  - name: Playwright-Screenshots
    path:
      - screenshots/**

post:
  - echo "Playwright execution completed"

